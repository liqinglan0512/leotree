server {
    listen 80;
    server_name 8.130.33.10;
    location ^~ /.well-known/acme-challenge/ { root /var/www/leotree-acme; }
    location / { return 302 https://8.130.33.10$request_uri; }
}
server {
    listen 443 ssl;
    server_name 8.130.33.10;
    ssl_certificate /etc/letsencrypt/live/8.130.33.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.130.33.10/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
